server:
  port: 8083
spring:
  application:
    name: t1-java-demo
  profiles:
    default: dev
logging:
  level:
    ROOT: INFO

t1:
  scan-path: ru.t1.java.service_2
  kafka:
    consumer:
      consumer1:
        group-id: t1-demo-transaction-accept
        max.poll.records: 10
        session-timeout: 10000
        heartbeat.interval: 3000
        period_ms: 1000
        max-number-of-transactions: 2
    producer:
      enable: true
    topic:
      client_transactions_accept: t1_demo_transaction_accept
      client_transactions_result: t1_demo_transaction_result
    listener:
      poll-timeout: 1000



