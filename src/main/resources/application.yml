spring:
  application:
    name: t1-java-demo
  datasource:
    url: jdbc:postgresql://localhost:5432/t1_demo
    username: postgres
    password: "0000"
    driverClassName: org.postgresql.Driver
  liquibase:
    enabled: true
    default-schema: t1_demo
    change-log: db/changelog/db.changelog-master.xml
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
logging:
  level:
    ROOT: INFO
    ru.t1.java.demo.controller.ClientController: DEBUG
    ru.t1.java.demo.service: DEBUG

t1:
  scan-path: ru.t1.java.demo
  kafka:
    bootstrap:
#      server: localhost:9092
      server:  ${KAFKA_SERVER:localhost:9092}
    consumer:
      consumer1:
        group-id: t1-demo
        max.poll.records: 10
        session-timeout: 10000
        heartbeat.interval: 3000
      consumer2:
        group-id: t1-demo-account
        max.poll.records: 10
        session-timeout: 10000
        heartbeat.interval: 3000
      consumer3:
        group-id: t1-demo-transaction
        max.poll.records: 10
        session-timeout: 10000
        heartbeat.interval: 3000
    producer:
      enable: true
    topic:
      metrics: t1_demo_metrics
      client_registration: t1_demo_client_registration
      client_id_registered: t1_demo_client_registered
      client_accounts: t1_demo_accounts
      client_transactions: t1_demo_transactions
      client_transactions_accept: t1_demo_transaction_accept
      client_transactions_result: t1_demo_transaction_result

    listener:
      poll-timeout: 1000



